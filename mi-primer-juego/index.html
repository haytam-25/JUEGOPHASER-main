<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover deja que el juego llegue hasta los bordes en moviles con notch -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!--
        Si el juego se añade a la pantalla de inicio, se abre sin la barra de
        direcciones: es la unica pantalla completa de verdad en iPhone, porque
        Safari no deja usar la API de fullscreen fuera de los videos.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juego Haytam" />
    <meta name="theme-color" content="#1a1008" />

    <link rel="stylesheet" href="/style.css">
    <title>Juego Haytam</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>

    <!--
        Aviso para moviles y tablets en vertical. El juego es 16:9 (1138x640), asi
        que en vertical quedaria como una franja diminuta. El CSS lo enseña solo
        cuando toca (pantalla tactil + orientacion vertical); en el ordenador nunca.
    -->
    <div id="girar-dispositivo">
        <div class="girar-movil" aria-hidden="true"></div>
        <h1>Gira el dispositivo</h1>
        <p>Ponlo en horizontal para jugar</p>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
